<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://kit.fontawesome.com/4541982187.js" crossorigin="anonymous"></script>
    <div class="topbar">
        <img src="images/logo.png" alt="College APP" id="title-img">
        <button class="sign-in-btn">
            <i class="fa-regular fa-circle-user" id="signin-icon"></i>
        </button>
        
    </div>
    <span id="sign-in-dropdown">
        <button>Account</button>
        <button>Log Out</button>
        <!-- these can be changed to <a href='link'></a> to make them links, but require styling changes -->
    </span>


    <div id="body-container">
        <!-- all main content should go in here -->


    </div>
    <script src="main.js"></script>
</body>
</html>
