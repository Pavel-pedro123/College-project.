<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeAPP - Sign In</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div id="main">
        <h2>Sign Up</h2>
        <p>Email:</p>
        <input type="text" id="username-in">
        <p>Password:</p>
        <input type="password" id="password-in">
        <p>Confirm Password:</p>
        <input type="password" id="password-conf-in">
        <button id="confirm-button">Sign In</button>
        <p>Already have an account?</p>
        <a href="/site/signin/">Sign In</a>
    
        
    </div>

    <script src="signin.js"></script>
</body>
</html>
