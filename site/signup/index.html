<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollegeAPP - Sign In</title>
    <link rel="stylesheet" href="signup.css">
    <script src="https://kit.fontawesome.com/4541982187.js" crossorigin="anonymous"></script>

</head>
<body>
    <div id="main">
        <h1>Sign Up</h1>

        <p>Email:</p>
        <input type="text" id="username-in">

        <p>Password:</p>
        <input type="password" id="password-in">
        <p id="pwd-req">(Must be at least 5 characters)</p>
        <span id="pwd-check-span">
            <i class="fa-solid fa-check pwd-check" id="pwd-check"></i>
            <p>Confirm Password:</p>
        </span>
        <input type="password" id="password-conf-in">

        <button id="confirm-button">Sign In</button>

        <p>Already have an account?</p>
        <a href="/site/signin/">Sign In</a>
    
        
    </div>

    <script src="signup.js"></script>
</body>
</html>
